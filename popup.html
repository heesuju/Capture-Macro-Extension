<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="scroll-area">
    <div id="status" class="status hidden"></div>

    <!-- Capture Area -->
    <div class="input-group">
      <label>Capture Area: <strong id="areaStatus">Full Page</strong></label>
      <div class="area-btn-group">
        <button class="area-btn active" data-ratio="full" title="Full Page">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="1"/>
            <line x1="3" y1="8" x2="21" y2="8"/>
          </svg>
          <span>Full</span>
        </button>
        <button class="area-btn" data-ratio="1" title="1:1 Square">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="4" width="16" height="16" rx="1"/>
          </svg>
          <span>1:1</span>
        </button>
        <button class="area-btn" data-ratio="1.7777" title="16:9 Widescreen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="6" width="20" height="12" rx="1"/>
          </svg>
          <span>16:9</span>
        </button>
        <button class="area-btn" data-ratio="1.3333" title="4:3 Standard">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="5" width="20" height="14" rx="1"/>
          </svg>
          <span>4:3</span>
        </button>
        <button class="area-btn" data-ratio="free" title="Free Form (Draw)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3h4v4H3zM17 3h4v4h-4zM3 17h4v4H3zM17 17h4v4h-4z"/>
            <line x1="7" y1="5" x2="17" y2="5" stroke-dasharray="2 2"/>
            <line x1="7" y1="19" x2="17" y2="19" stroke-dasharray="2 2"/>
            <line x1="5" y1="7" x2="5" y2="17" stroke-dasharray="2 2"/>
            <line x1="19" y1="7" x2="19" y2="17" stroke-dasharray="2 2"/>
          </svg>
          <span>Free</span>
        </button>
      </div>
      <button id="btnSetArea" class="btn secondary" style="display: none;">Draw Area on Page</button>
    </div>

    <!-- Filename Prefix -->
    <div class="input-group">
      <label>Filename Prefix</label>
      <input type="text" id="prefixInput" placeholder="e.g., my_capture" />
    </div>

    <!-- Macro Toggle Row -->
    <div class="macro-toggle-row" id="macroToggleRow">
      <div class="macro-toggle-left">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
        </svg>
        <span class="macro-toggle-label">Macro</span>
        <span class="macro-badge" id="macroBadge" style="display:none;"></span>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="macroEnabledToggle">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <!-- Macro Panel (expands when toggle is on) -->
    <div class="macro-panel" id="macroPanel">
      <div class="macro-panel-inner">

        <!-- Capture order -->
        <label class="checkbox-label">
          <input type="checkbox" id="captureFirstCheckbox">
          Capture first, then run macro
        </label>

        <!-- Recordings select + delete -->
        <div class="recordings-row">
          <select id="savedRecordingsSelect">
            <option value="">＋ New Recording</option>
          </select>
          <button id="btnDelete" class="btn danger icon-btn" title="Delete recording" style="display:none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14H6L5 6"/>
              <path d="M10 11v6M14 11v6"/>
            </svg>
          </button>
        </div>

        <!-- Record section: shown when New is selected -->
        <div id="recordSection">
          <div class="macro-stat">
            <span>Actions recorded</span>
            <strong id="actionCount">0</strong>
          </div>
          <button id="btnRecord" class="btn primary record-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
            Record
          </button>
        </div>

        <!-- Save row: shown after stopping a new recording -->
        <div id="saveSection" class="save-row" style="display:none;">
          <input type="text" id="saveNameInput" placeholder="Recording name">
          <button id="btnSave" class="btn success small">Save</button>
        </div>

      </div>
    </div>

    </div><!-- /.scroll-area -->

    <!-- Run Button -->
    <div class="main-action-container">
      <button id="btnPlay" class="btn success">
        <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Run
      </button>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
