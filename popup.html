<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto Capture Macro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>Auto Capture</h2>
    
    <div id="status" class="status hidden"></div>
    
    <div class="tabs">
      <button class="tab-btn active" data-target="tab-capture">Capture</button>
      <button class="tab-btn" data-target="tab-macro">Macro</button>
    </div>

    <!-- Capture Tab -->
    <div id="tab-capture" class="tab-content active">
      <div class="stats">
        <span>Capture Area: <strong id="areaStatus">Full Page</strong></span>
      </div>
      
      <div class="input-group">
        <label>Capture Area</label>
        <div class="area-btn-group">
          <button class="area-btn active" data-ratio="full" title="Full Page">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="1"/>
              <line x1="3" y1="8" x2="21" y2="8"/>
            </svg>
            <span>Full</span>
          </button>
          <button class="area-btn" data-ratio="1" title="1:1 Square">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="4" y="4" width="16" height="16" rx="1"/>
            </svg>
            <span>1:1</span>
          </button>
          <button class="area-btn" data-ratio="1.7777" title="16:9 Widescreen">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="6" width="20" height="12" rx="1"/>
            </svg>
            <span>16:9</span>
          </button>
          <button class="area-btn" data-ratio="1.3333" title="4:3 Standard">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="5" width="20" height="14" rx="1"/>
            </svg>
            <span>4:3</span>
          </button>
          <button class="area-btn" data-ratio="free" title="Free Form (Draw)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3h4v4H3zM17 3h4v4h-4zM3 17h4v4H3zM17 17h4v4h-4z"/>
              <line x1="7" y1="5" x2="17" y2="5" stroke-dasharray="2 2"/>
              <line x1="7" y1="19" x2="17" y2="19" stroke-dasharray="2 2"/>
              <line x1="5" y1="7" x2="5" y2="17" stroke-dasharray="2 2"/>
              <line x1="19" y1="7" x2="19" y2="17" stroke-dasharray="2 2"/>
            </svg>
            <span>Free</span>
          </button>
        </div>
        <button id="btnSetArea" class="btn secondary" style="display: none;">Draw Area on Page</button>
      </div>

      <div class="input-group">
        <label>Filename Prefix</label>
        <input type="text" id="prefixInput" placeholder="e.g., my_capture" />
      </div>
    </div>

    <!-- Macro Tab -->
    <div id="tab-macro" class="tab-content">
      <div class="stats">
        <span>Actions Recorded: <strong id="actionCount">0</strong></span>
      </div>

      <div class="controls">
        <label class="checkbox-label" style="margin-top: 0; justify-content: center; margin-bottom: 5px;">
          <input type="checkbox" id="captureFirstCheckbox">
          Capture first, then action
        </label>
        <button id="btnRecord" class="btn primary">Start Recording</button>
        <button id="btnClear" class="btn danger">Clear Macro</button>
      </div>

      <div class="save-load-group">
        <h4>Saved Recordings</h4>
        <div class="save-row">
          <input type="text" id="saveNameInput" placeholder="Recording name">
          <button id="btnSave" class="btn primary small">Save</button>
        </div>
        <div class="load-row">
          <select id="savedRecordingsSelect">
            <option value="">Select a recording...</option>
          </select>
          <button id="btnLoad" class="btn secondary small">Load</button>
          <button id="btnDelete" class="btn danger small">Delete</button>
        </div>
      </div>
    </div>

    <!-- Persistent Play Button -->
    <div class="main-action-container">
      <button id="btnPlay" class="btn success" disabled>
        <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Run
      </button>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
